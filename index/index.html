<!DOCTYPE html>
<html>
    <head>
        <title>
          Home page
        </title>
    </head>
    <body>
        <link rel="stylesheet" href="index.css">
            <div class="welcome">
                <h2>Welcome to the Game!</h2>
            </div>
            <button class="play" id="play">Play ▶</button>
            <button class="setting" id="setting">⚙️</button>
            <div id="settingoption" style="display:none;">
                <button>Sound</button>
                <button>Theme</button>
                <button>Help</button>
                <button>About</button>
                <button>Contact</button>
                <button>Feedback</button>
            </div>
            <div id="box">
                <button id="player" class="popup">Player vs Player</button>
                <button id="computer" class="popup">Computer vs Player</button>
            </div>
            <div id="computerlevel">
                <button id="easy" class="level">Easy</button>
                <button id="medium" class="level">Medium</button>
                <button id="difficult" class="level">Impossible</button>
            </div>
    </body>
    <script src="index.js"></script>
</html>
